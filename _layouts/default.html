<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1E3448">
    <link rel="icon" type="image/svg+xml" href="{{ '/images/logo.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}" media="screen" type="text/css">
    <link rel="stylesheet" href="{{ '/assets/css/print.css' | relative_url }}" media="print" type="text/css">

{% seo %}
    {% include head-custom.html %}
    <style>
      /* Glazer3S additions on top of the Architect theme */
      header .site-logo {
        display: block;
        width: 64px;
        height: 64px;
        margin-bottom: 12px;
      }
      header a.button.contact-button {
        background: #E39B2D;
        background-image: none;
        border-color: #E39B2D;
        color: #1E3448;
        padding: 10px 20px;
        text-shadow: none;
      }
      header a.button.contact-button small { color: #1E3448; }
      header a.button.contact-button:hover,
      header a.button.contact-button:focus {
        background: #F0B456;
        background-image: none;
        color: #1E3448;
        text-decoration: none;
      }
      #main-content img { max-width: 100%; height: auto; }
      #sidebar .contact-links { list-style: none; margin: 0 0 1em; padding: 0; }
      #sidebar .contact-links li { margin-bottom: 0.4em; }
    </style>
  </head>

  <body>
    <header>
      <div class="inner">
        <a href="{{ '/' | absolute_url }}">
          <img class="site-logo" src="{{ '/images/logo.svg' | relative_url }}" alt="Glazer3S logo">
          <h1>{{ site.title | default: site.github.repository_name }}</h1>
        </a>
        <h2>{{ site.description | default: site.github.project_tagline }}</h2>
        <a href="mailto:jason@glazer3s.com?subject=Glazer3S%20inquiry" class="button contact-button"><small>Discuss your project</small> Contact me</a>
      </div>
    </header>

    <div id="content-wrapper">
      <div class="inner clearfix">
        <section id="main-content">
          {{ content }}
        </section>

        <aside id="sidebar">
          <ul class="contact-links">
            <li><a href="mailto:jason@glazer3s.com?subject=Glazer3S%20inquiry">jason@glazer3s.com</a></li>
            <li><a href="https://www.linkedin.com/in/jasonglazerengineer/">LinkedIn</a></li>
            <li><a href="https://github.com/JasonGlazer">GitHub</a></li>
          </ul>
          <p>&copy; {{ site.time | date: '%Y' }} Glazer3S LLC</p>
        </aside>
      </div>
    </div>
  </body>
</html>
